<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>고객지원 | 말론투자</title>
    <meta name="description" content="말론투자 고객지원" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Noto Sans KR", "ui-sans-serif", "system-ui"] } } } };
    </script>
    <link rel="stylesheet" href="../assets/clone.css" />
  </head>
  <body class="font-sans mesh-bg text-slate-900">
    <header class="fixed top-0 left-0 right-0 z-50">
      <div class="glass-header">
        <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
          <a class="flex items-center gap-3" href="../">
            <img class="logo-icon logo-icon--sm" src="../assets/malon-logo-icon-v4.svg" alt="말론투자 로고" />
            <div class="text-2xl font-black tracking-tight">말론투자</div>
          </a>
          <nav class="hidden md:flex items-center gap-2 text-sm font-bold">
            <a class="nav-link" href="../">홈</a>
            <a class="nav-link" href="../company/">회사소개</a>
            <a class="nav-link" href="../business/">사업영역</a>
            <a class="nav-link" href="../support/">고객지원</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="pt-[73px]">
      <section class="hero-bg relative">
        <div class="absolute inset-0 bg-gradient-to-b from-[#071125]/85 via-[#071125]/45 to-transparent"></div>
        <div class="relative max-w-6xl mx-auto px-5 py-16 md:py-20">
          <div class="max-w-2xl">
            <div class="inline-flex items-center gap-2 bg-white/10 text-white border border-white/15 rounded-full px-4 py-2 text-xs font-bold">
              <span class="w-2 h-2 rounded-full" style="background: linear-gradient(135deg, var(--blue), var(--gold));"></span>
              <span>Support</span>
            </div>
            <h1 class="text-3xl md:text-5xl font-black mt-5 text-white break-keep">고객지원</h1>
            <p class="text-white/80 mt-4 leading-relaxed">
              본 사이트는 유사투자자문업을 영위함으로써 홈페이지 내 양방향소통을 위한 창구는 없습니다. 읽기 전용 홈페이지 입니다.
            </p>
          </div>
        </div>
      </section>

      <section class="max-w-6xl mx-auto px-5 py-14 md:py-20">
        <div class="grid md:grid-cols-2 gap-6">
          <a class="card-soft card-border rounded-3xl p-7 lift block" href="./notice/">
            <div class="text-xs font-black tracking-widest uppercase" style="color: var(--muted);">Notice</div>
            <div class="mt-2 text-2xl font-black" style="color: var(--ink);">공지사항</div>
            <div class="mt-3 text-sm leading-relaxed" style="color: var(--muted);">운영자만 등록하며 방문자는 열람만 가능합니다.</div>
          </a>
          <a class="card-soft card-border rounded-3xl p-7 lift block" href="./press/">
            <div class="text-xs font-black tracking-widest uppercase" style="color: var(--muted);">Press</div>
            <div class="mt-2 text-2xl font-black" style="color: var(--ink);">보도자료</div>
            <div class="mt-3 text-sm leading-relaxed" style="color: var(--muted);">현재는 샘플 페이지입니다.</div>
          </a>
        </div>
      </section>
    </main>

    <footer class="border-t" style="border-color: var(--line); background: rgba(255,255,255,.70); backdrop-filter: blur(10px);">
      <div class="max-w-6xl mx-auto px-5 py-10">
        <div class="text-xs" style="color: rgba(91,107,133,.85);">© <span id="y"></span> 말론투자. All Rights Reserved.</div>
      </div>
    </footer>
    <script>
      document.getElementById("y").textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
