<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>글로벌 금융 마케팅 | 말론투자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Noto Sans KR", "ui-sans-serif", "system-ui"] } } } };
    </script>
    <link rel="stylesheet" href="../../assets/clone.css" />
  </head>
  <body class="font-sans mesh-bg text-slate-900">
    <header class="fixed top-0 left-0 right-0 z-50">
      <div class="glass-header">
        <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
          <a class="flex items-center gap-3" href="../../">
            <img class="logo-icon logo-icon--sm" src="../../assets/malon-logo-icon-v4.svg" alt="말론투자 로고" />
            <div class="text-2xl font-black tracking-tight">말론투자</div>
          </a>
          <nav class="hidden md:flex items-center gap-2 text-sm font-bold">
            <a class="nav-link" href="../../">홈</a>
            <a class="nav-link" href="../../company/">회사소개</a>
            <a class="nav-link" href="../">사업영역</a>
            <a class="nav-link" href="../../support/">고객지원</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="pt-[73px] max-w-6xl mx-auto px-5 py-14 md:py-20">
      <div class="card-soft card-border rounded-3xl p-7 md:p-10">
        <div class="text-xs font-black tracking-widest uppercase" style="color: var(--muted);">Marketing</div>
        <h1 class="text-3xl md:text-4xl font-black mt-3" style="color: var(--ink);">글로벌 금융 마케팅</h1>
        <p class="mt-6 text-base leading-relaxed" style="color: var(--muted);">
          브랜드 포지셔닝과 유동성 확보를 위한 통합 마케팅 운영 구조를 제공합니다.
        </p>
        <div class="mt-8 grid md:grid-cols-3 gap-4">
          <div class="card-soft rounded-2xl p-5">
            <div class="font-black" style="color: var(--ink);">포지셔닝</div>
            <div class="mt-2 text-sm" style="color: var(--muted);">핵심 메시지/차별점 정리</div>
          </div>
          <div class="card-soft rounded-2xl p-5">
            <div class="font-black" style="color: var(--ink);">채널 운영</div>
            <div class="mt-2 text-sm" style="color: var(--muted);">콘텐츠/커뮤니티/광고 믹스</div>
          </div>
          <div class="card-soft rounded-2xl p-5">
            <div class="font-black" style="color: var(--ink);">성과 측정</div>
            <div class="mt-2 text-sm" style="color: var(--muted);">지표 정의 및 리포트</div>
          </div>
        </div>
        <div class="mt-10 flex flex-col sm:flex-row gap-3">
          <a class="btn-primary w-full sm:w-auto" href="../../support/notice/">공지사항</a>
          <a class="btn-secondary w-full sm:w-auto" href="../">사업영역으로</a>
        </div>
      </div>
    </main>

    <footer class="border-t" style="border-color: var(--line); background: rgba(255,255,255,.70); backdrop-filter: blur(10px);">
      <div class="max-w-6xl mx-auto px-5 py-10">
        <div class="text-xs" style="color: rgba(91,107,133,.85);">© <span id="y"></span> 말론투자. All Rights Reserved.</div>
      </div>
    </footer>
    <script>
      document.getElementById("y").textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
