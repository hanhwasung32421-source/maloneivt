<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>사업영역 | 말론투자</title>
    <meta name="description" content="말론투자 사업영역" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Noto Sans KR", "ui-sans-serif", "system-ui"] } } } };
    </script>
    <link rel="stylesheet" href="../assets/clone.css" />
  </head>
  <body class="font-sans mesh-bg text-slate-900">
    <header class="fixed top-0 left-0 right-0 z-50">
      <div class="glass-header">
        <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
          <a class="flex items-center gap-3" href="../">
            <img class="logo-icon logo-icon--sm" src="../assets/malon-logo-icon-v4.svg" alt="말론투자 로고" />
            <div class="text-2xl font-black tracking-tight">말론투자</div>
          </a>
          <nav class="hidden md:flex items-center gap-2 text-sm font-bold">
            <a class="nav-link" href="../">홈</a>
            <a class="nav-link" href="../company/">회사소개</a>
            <a class="nav-link" href="../business/">사업영역</a>
            <a class="nav-link" href="../support/">고객지원</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="pt-[73px]">
      <section class="hero-bg relative">
        <div class="absolute inset-0 bg-gradient-to-b from-[#071125]/85 via-[#071125]/45 to-transparent"></div>
        <div class="relative max-w-6xl mx-auto px-5 py-16 md:py-20">
          <div class="max-w-2xl">
            <div class="inline-flex items-center gap-2 bg-white/10 text-white border border-white/15 rounded-full px-4 py-2 text-xs font-bold">
              <span class="w-2 h-2 rounded-full" style="background: linear-gradient(135deg, var(--gold), var(--cyan));"></span>
              <span>Business</span>
            </div>
            <h1 class="text-3xl md:text-5xl font-black mt-5 text-white break-keep">사업영역</h1>
            <p class="text-white/80 mt-4 leading-relaxed">
              끝없는 투자 연구와 구조화된 분석으로, 필요한 정보만 명확하게 전달합니다.
            </p>
          </div>
        </div>
      </section>

      <section class="max-w-6xl mx-auto px-5 py-14 md:py-20">
        <div class="grid md:grid-cols-2 gap-6">
          <a class="card-soft card-border rounded-3xl p-7 lift block" href="./advisory/">
            <div class="text-xs font-black tracking-widest uppercase" style="color: var(--muted);">01</div>
            <div class="mt-2 text-2xl font-black" style="color: var(--ink);">유사투자자문 서비스</div>
            <div class="mt-3 text-sm leading-relaxed" style="color: var(--muted);">리서치 기반 정보 제공 구조를 설계합니다.</div>
          </a>
          <a class="card-soft card-border rounded-3xl p-7 lift block" href="./marketing/">
            <div class="text-xs font-black tracking-widest uppercase" style="color: var(--muted);">02</div>
            <div class="mt-2 text-2xl font-black" style="color: var(--ink);">글로벌 금융 마케팅</div>
            <div class="mt-3 text-sm leading-relaxed" style="color: var(--muted);">브랜드/유입/전환을 지표로 관리합니다.</div>
          </a>
          <a class="card-soft card-border rounded-3xl p-7 lift block" href="./mcn/">
            <div class="text-xs font-black tracking-widest uppercase" style="color: var(--muted);">03</div>
            <div class="mt-2 text-2xl font-black" style="color: var(--ink);">MCN 사업</div>
            <div class="mt-3 text-sm leading-relaxed" style="color: var(--muted);">콘텐츠 품질과 신뢰를 우선합니다.</div>
          </a>
          <a class="card-soft card-border rounded-3xl p-7 lift block" href="./vc/">
            <div class="text-xs font-black tracking-widest uppercase" style="color: var(--muted);">04</div>
            <div class="mt-2 text-2xl font-black" style="color: var(--ink);">벤처캐피탈</div>
            <div class="mt-3 text-sm leading-relaxed" style="color: var(--muted);">단계별 성장 지원을 지향합니다.</div>
          </a>
        </div>
      </section>
    </main>

    <footer class="border-t" style="border-color: var(--line); background: rgba(255,255,255,.70); backdrop-filter: blur(10px);">
      <div class="max-w-6xl mx-auto px-5 py-10">
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
          <div class="text-sm" style="color: var(--muted);">공지사항은 운영자만 등록하며 방문자는 열람만 가능합니다.</div>
          <a class="btn-primary" href="../support/notice/">공지사항</a>
        </div>
        <div class="mt-8 text-xs" style="color: rgba(91,107,133,.85);">© <span id="y"></span> 말론투자. All Rights Reserved.</div>
      </div>
    </footer>
    <script>
      document.getElementById("y").textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
